<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lamnso Larry Njo Dictionary - NICC Bamdzeng</title>
<style>
body{font-family:Arial,sans-serif;max-width:900px;margin:0 auto;padding:20px;background:#f5f5f5;transition:0.3s}
body.dark{background:#111;color:#eee}
h1{text-align:center;color:#2c3e50;margin-bottom:10px}
body.dark h1{color:#eee}
.subtitle{text-align:center;color:#7f8c8d;margin-bottom:15px}
#search{width:100%;padding:14px;font-size:17px;border:2px solid #3498db;border-radius:10px;margin-bottom:15px;box-sizing:border-box}
.topbar{text-align:center;margin-bottom:15px}
.btn{padding:9px 14px;border:none;border-radius:8px;margin:4px;font-weight:600;cursor:pointer}
.btn-export{background:orange;color:#000}.btn-import{background:#10b981;color:#fff}.btn-dark{background:#222;color:#fff}
.word{background:#fff;padding:16px;margin:10px 0;border-radius:10px;box-shadow:0 2px 5px rgba(0,0,0,.1);border-left:4px solid #3498db}
.lamnso{font-size:21px;font-weight:bold;color:#c0392b;margin-bottom:5px}
.english{font-size:16px;color:#34495e}
#count{text-align:center;color:#7f8c8d;margin-bottom:15px}
</style>
</head>
<body>
<h1>📚 Lamnso Larry Njo Dictionary</h1>
<p class="subtitle">NICC Bamdzeng • Nso Heritage Since 2007 • 3-Year Project to 2029</p>
<div class="topbar">
<button class="btn btn-dark" onclick="toggleDark()">🌙 Dark</button>
<button class="btn btn-export" onclick="exportJSON()">📄 Export JSON</button>
<label class="btn btn-import">📤 Import<input type="file" id="importFile" hidden onchange="importJSON(event)"></label>
</div>
<input type="text" id="search" placeholder="Type to search... e.g. Mendzəv or Water">
<div id="count">Loading dictionary...</div>
<div id="results"></div>
<div style="text-align:center;font-size:11px;color:#888;margin-top:30px" id="status">GitHub Safe • NICC Bamdzeng</div>
<script>
let dictionary = [
{lamnso:"Nta'", english:"chair"},
{lamnso:"Kikún", english:"Bed"},
{lamnso:"Bvə̀rnaŋkí", english:"Blanket"},
{lamnso:"Mbuùy", english:"Pillow"},
{lamnso:"Ŋkiŋkikùn", english:"Bed support"},
{lamnso:"Tèŋlav", english:"Window"},
{lamnso:"Kiseŋ", english:"Door shutter"},
{lamnso:"Mfìn", english:"lock"},
{lamnso:"Kinsə̀ŋ", english:"foundation"},
{lamnso:"Kiboó", english:"Backyard"},
{lamnso:"Mbvəmlav", english:"Inside the house"},
{lamnso:"Kìy", english:"Fire place"},
{lamnso:"Faási", english:"Fire place stone"},
{lamnso:"Və́y", english:"Fire"},
{lamnso:"Cíŋkóo", english:"Cigarette pipe"},
{lamnso:"Ntòn", english:"Small pot"},
{lamnso:"Kiyúy", english:"Steam or vapour"},
{lamnso:"Nsaàlav", english:"The Floor"},
{lamnso:"Kitém", english:"Calabash"},
{lamnso:"Kighín", english:"Calabash bowl"},
{lamnso:"Kicí", english:"Tree"},
{lamnso:"Tám kici", english:"Branch"},
{lamnso:"Kibábár", english:"Dry leaf"},
{lamnso:"Vàv", english:"Wet leaf"},
{lamnso:"Kibuushì", english:"Flower"},
{lamnso:"Bàŋ", english:"Fruit"},
{lamnso:"Ŋgoòy", english:"Seed"},
{lamnso:"Woŋrì kici", english:"Stem"},
{lamnso:"Gháŋ", english:"Root"},
{lamnso:"Nsay", english:"Soil"},
{lamnso:"Ŋkənri", english:"Recapitulation"}
];
const resultsDiv = document.getElementById('results');
const countDiv = document.getElementById('count');
async function loadDict(){
 try{
  let res = await fetch('lamnso.json?v='+Date.now());
  if(res.ok){
   let data = await res.json();
   let jsonWords = [];
   if(Array.isArray(data)){
     if(data[0].lamnso) jsonWords = data;
     else if(data[0].word) jsonWords = data.map(x=>({lamnso:x.word, english:x.meaning||x.english}));
   }
   // merge, remove duplicates
   let seen = new Set(dictionary.map(d=>d.lamnso.toLowerCase()));
   jsonWords.forEach(w=>{ if(w.lamnso &&!seen.has(w.lamnso.toLowerCase())){ dictionary.push(w); seen.add(w.lamnso.toLowerCase()); } });
  }
 }catch(e){ console.log('Could not load lamnso.json', e); }
 show('');
}
document.getElementById('search').oninput = e => show(e.target.value.toLowerCase());
function show(q){
  let filtered = dictionary.filter(i=>i.lamnso.toLowerCase().includes(q)||i.english.toLowerCase().includes(q));
  let out = filtered.map(i=>`<div class="word"><div class="lamnso">${i.lamnso}</div><div class="english">${i.english}</div></div>`).join('');
  resultsDiv.innerHTML = out || 'No results found. Try another word.';
  countDiv.innerHTML = q? `${filtered.length} results` : `${dictionary.length} words in dictionary - NICC Bamdzeng`;
  document.getElementById('status').innerText = `${dictionary.length} words • GitHub Safe • NICC Bamdzeng`;
}
function toggleDark(){ document.body.classList.toggle('dark'); localStorage.setItem('dark', document.body.classList.contains('dark')?'1':'0'); }
if(localStorage.getItem('dark')==='1') document.body.classList.add('dark');
function exportJSON(){
  let data=JSON.stringify(dictionary,null,2);
  let blob=new Blob([data],{type:'application/json'});
  let a=document.createElement('a'); let d=new Date().toISOString().slice(0,10);
  a.href=URL.createObjectURL(blob); a.download='Lamnso_'+dictionary.length+'words_'+d+'.json'; a.click();
}
function importJSON(e){
  let file=e.target.files[0]; if(!file) return;
  let r=new FileReader(); r.onload=ev=>{
    try{
      let imp=JSON.parse(ev.target.result);
      if(!Array.isArray(imp)) throw 0;
      if(imp.length>0 && imp[0].lamnso){ dictionary=imp; }
      else if(imp.length>0 && imp[0].word){ dictionary=imp.map(x=>({lamnso:x.word, english:x.meaning})); }
      else throw 0; show(''); alert('Imported '+dictionary.length+' words! Now commit this index.html');
    }catch{ alert('Invalid JSON file'); }
  }; r.readAsText(file);
}
loadDict();
</script>
</body>
</html>
