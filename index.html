<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lamnso Dictionary - Larry Njo</title>
<style>:root{--bg:#f6f8f6;--card:#fff;--text:#111;--green:#0d4a0d;--bd:#ddd}.dark{--bg:#0f1710;--card:#1b2a1d;--text:#e8f5e9;--bd:#2a4a2e}
*{box-sizing:border-box}body{max-width:900px;margin:auto;padding:12px;background:var(--bg);color:var(--text);font-family:system-ui}h1{text-align:center;color:var(--green)}
input,select{width:100%;padding:14px;border:2px solid var(--green);border-radius:12px;background:var(--card);color:var(--text);margin:5px 0}
.btn{padding:8px 14px;border:1px solid var(--bd);border-radius:20px;background:var(--card);color:var(--text);cursor:pointer;margin:3px}
.btn.active{background:var(--green);color:#fff}.card{background:var(--card);border:1px solid var(--bd);padding:12px;margin:8px 0;border-radius:12px}
.l{font-weight:bold;color:var(--green);font-size:18px}.pos{font-size:11px;background:#e8f5e9;padding:2px 8px;border-radius:10px}
#addBox{display:none;background:var(--card);border:2px solid var(--green);padding:15px;border-radius:15px;margin:10px 0}
</style></head><body>
<h1>📖 Lamnso Dictionary</h1><p style="text-align:center">Larry Njo - Nso Heritage</p>
<div style="text-align:center">
<button class="btn" onclick="document.body.classList.toggle('dark')">🌙 Dark Mode</button>
<button class="btn" style="background:var(--green);color:#fff" onclick="toggleAdd()">➕ Add Word</button>
<button class="btn" onclick="document.getElementById('fileIn').click()">📥 Import CSV/JSON</button>
<button class="btn" onclick="exportJSON()">⬇️ Export</button>
<button class="btn" onclick="removeDup()">🧹 Duplicates</button>
<input type="file" id="fileIn" hidden accept=".json,.csv">
</div>

<div id="addBox">
<h3>➕ Add New Word</h3>
<input id="newLamnso" placeholder="Lamnso word e.g. Mendzəv">
<input id="newEng" placeholder="English e.g. Water">
<select id="newPos"><option value="noun">Noun</option><option value="verb">Verb</option><option value="adjective">Adjective</option><option value="greeting">Greeting</option><option value="number">Number</option><option value="other">Other</option></select>
<button class="btn active" onclick="addWord()">Save Word ✅</button>
<button class="btn" onclick="toggleAdd()">Cancel</button>
</div>

<input id="q" placeholder="Search... mendzəv, water">
<div style="text-align:center;margin:10px" id="cats">
<button class="btn active" data-c="all">All</button><button class="btn" data-c="noun">Nouns</button><button class="btn" data-c="verb">Verbs</button><button class="btn" data-c="adjective">Adjectives</button><button class="btn" data-c="greeting">Greetings</button><button class="btn" data-c="number">Numbers</button><button class="btn" data-c="other">Others</button>
</div>
<div id="count" style="text-align:center;font-weight:bold">Loading...</div><div id="list"></div>
<script>
let all=[],cat='all';fetch('./lamnso.json').then(r=>r.json()).then(d=>{all=d;update()}).catch(e=>{document.getElementById('count').innerText='Error: '+e});
function update(){document.getElementById('count').innerText=all.length+' words loaded ✅';apply(document.getElementById('q').value)}
function render(a){let h='';a.slice(0,500).forEach(o=>{h+=`<div class="card"><span class="l">${o.lamnso}</span><span class="pos">${o.pos}</span><div>${o.english}</div></div>`});document.getElementById('list').innerHTML=h||'No words found'}
document.getElementById('q').addEventListener('input',e=>apply(e.target.value));
document.querySelectorAll('#cats.btn').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('#cats.btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');cat=b.dataset.c;apply(document.getElementById('q').value)}));
function apply(q=''){q=q.toLowerCase();let f=all.filter(o=>{if(cat!='all'&&o.pos!=cat)return false;return!q||(o.lamnso+' '+o.english).toLowerCase().includes(q)});document.getElementById('count').innerText=f.length+' / '+all.length+' words • '+cat;render(f)}
function toggleAdd(){let b=document.getElementById('addBox');b.style.display=b.style.display==='none'?'block':'none'}
function addWord(){let l=document.getElementById('newLamnso').value.trim(),e=document.getElementById('newEng').value.trim(),p=document.getElementById('newPos').value;if(!l||!e)return alert('Fill both words');all.unshift({lamnso:l,english:e,pos:p});document.getElementById('newLamnso').value='';document.getElementById('newEng').value='';toggleAdd();update();alert('Added! Now Export to save');}
function exportJSON(){let blob=new Blob([JSON.stringify(all,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='lamnso.json';a.click()}
function removeDup(){let seen=new Set(),out=[];all.forEach(o=>{let k=(o.lamnso+'|'+o.english).toLowerCase();if(!seen.has(k)){seen.add(k);out.push(o)}});alert((all.length-out.length)+' removed');all=out;update()}
document.getElementById('fileIn').addEventListener('change',e=>{
  let file=e.target.files[0];if(!file)return;let r=new FileReader();
  r.onload=ev=>{
    try{
      if(file.name.endsWith('.json')){let d=JSON.parse(ev.target.result);all=all.concat(d.map(x=>({lamnso:x.lamnso||x.word,english:x.english||x.meaning,pos:(x.pos||x.type||'noun').toLowerCase()})))}
      else{let lines=ev.target.result.split('\n');lines.slice(1).forEach(line=>{let c=line.split(',');if(c.length>=2){let lam=c[0].replace(/"/g,'').trim(),eng=c[1].replace(/"/g,'').trim(),pos=(c[2]||'noun').replace(/"/g,'').trim().toLowerCase();if(lam&&eng)all.push({lamnso:lam,english:eng,pos:pos})}})}
      alert(file.name+' imported! Total: '+all.length+' words. Now click Export!');update();
    }catch(err){alert('Import error: '+err)}
  };
  if(file.name.endsWith('.json'))r.readAsText(file);else r.readAsText(file);
});
</script></body></html>
