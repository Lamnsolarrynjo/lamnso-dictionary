<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lamnso Dictionary</title>
<style>
  body { font-family: Arial; padding: 20px; background: #f5f5f5; }
  input { width: 100%; padding: 10px; font-size: 16px; margin-bottom: 20px; }
  .word { background: white; padding: 15px; margin: 10px 0; border-radius: 8px; }
  .lamnso { font-weight: bold; font-size: 18px; color: #2c3e50; }
  .english { color: #7f8c8d; }
</style>
</head>
<body>

<h1>Lamnso Dictionary</h1>
<input type="text" id="search" placeholder="Search Lamnso or English...">
<div id="results">Loading...</div>

<script>
let dictionary = [];

// 1. LOAD THE JSON FILE
fetch('lamnso.json')
  .then(response => response.json())
  .then(data => {
    dictionary = data;
    document.getElementById('results').innerHTML = 'Type to search 159 words';
  })
  .catch(error => {
    document.getElementById('results').innerHTML = 'Error loading dictionary: ' + error;
  });

// 2. SEARCH FUNCTION
document.getElementById('search').addEventListener('input', function() {
  let query = this.value.toLowerCase();
  let resultsDiv = document.getElementById('results');
  
  if(query.length < 1) {
    resultsDiv.innerHTML = 'Type to search 159 words';
    return;
  }

  let filtered = dictionary.filter(item => 
    item.lamnso.toLowerCase().includes(query) || 
    item.english.toLowerCase().includes(query)
  );

  if(filtered.length === 0) {
    resultsDiv.innerHTML = 'No results found';
    return;
  }

  resultsDiv.innerHTML = filtered.map(item => `
    <div class="word">
      <div class="lamnso">${item.lamnso}</div>
      <div class="english">${item.english}</div>
    </div>
  `).join('');
});
</script>

</body>
</html>
